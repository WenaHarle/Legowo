sentence=Hubungkan ESP32 ke platform IoT Legowo: dashboard, kontrol jarak jauh, dan update firmware OTA.
paragraph=Cukup Legowo.begin(ssid, password, deviceKey) dan Legowo.run(). Koneksi MQTT over WebSocket + TLS dengan verifikasi sertifikat, reconnect otomatis, LEGOWO_WRITE(channel) untuk kontrol dari dashboard, binding pin tanpa kode, timer tanpa delay(), serta OTA bawaan dengan verifikasi SHA-256/tanda tangan dan rollback otomatis.
