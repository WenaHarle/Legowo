sentence=Connect an ESP32 to the Legowo IoT platform: dashboard, remote control, and OTA firmware updates.
paragraph=Just Legowo.begin(ssid, password, deviceKey) and Legowo.run(). MQTT over WebSocket + TLS with certificate verification, automatic reconnect, LEGOWO_RECEIVE(channel) for control from the dashboard, code-free pin bindings, delay()-free timers, and built-in OTA with SHA-256/signature verification and automatic rollback.
